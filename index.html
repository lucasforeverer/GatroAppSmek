<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58d36b">
<title>GastroApp</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ef;--card:#fff;--ink:#14201a;--mu:#68756c;--ln:#e6ebe2;--g:#58d36b;--gt:#1a7a3a;--g2:#e1f6e6;--y:#ffcf3f;--yt:#8a6200;--y2:#fff3c9;--o:#f08a24;--ot:#a14d00;--o2:#ffecd5;--r:#e5484d;--rt:#b3202a;--r2:#fde7e7;--b2:#e3edff;--emt:#24402c;--eml:90%;
--sh:0 1px 2px rgba(20,40,25,.05),0 10px 28px rgba(20,40,25,.07);--f:"Figtree",system-ui,sans-serif;--fh:"Bricolage Grotesque","Figtree",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#19211b;--ink:#eef4ee;--mu:#98a59c;--ln:#27312a;--g:#58d36b;--gt:#6ee79a;--g2:#173524;--y:#ffd75e;--yt:#ffd75e;--y2:#3a3112;--o:#ffb066;--ot:#ffb066;--o2:#3b2a14;--r:#ff7a7f;--rt:#ff8d91;--r2:#3d1b1d;--b2:#172a46;--emt:#eaf6ec;--eml:26%;--sh:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.02em}
h1{font-size:30px;font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:14px;font-weight:600;font-family:var(--f);color:var(--mu);margin:18px 0 8px}
small,.mu{color:var(--mu)}small{font-size:12.5px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.shell{max-width:1120px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px;padding:16px 0 8px}
#logo{width:44px;height:44px;object-fit:contain;border-radius:14px}
.brand b{font:800 21px var(--fh);display:block;line-height:1.1}
#sy{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
#sy::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
#sy.off::before{background:var(--o)}
main{padding:8px 0 130px;min-height:80vh}
main.in{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* navegación */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 11px var(--f);color:var(--mu);border-radius:16px;transition:.2s}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;padding:0;transition:.25s}
#nav button.on{color:var(--ink)}
#nav button.on svg{background:var(--g);color:#0f2316;width:48px;height:30px;padding:3px 12px;border-radius:99px;box-sizing:border-box;transform:translateY(-2px)}
@media (min-width:900px){
 .shell{display:grid;grid-template-columns:230px 1fr;gap:34px;padding:0 28px}
 .side{position:sticky;top:0;align-self:start;padding-top:18px;height:100vh}
 #nav{position:static;display:flex;flex-direction:column;gap:6px;padding:14px 0;background:none;backdrop-filter:none;border:0}
 #nav button{flex-direction:row;gap:12px;padding:11px 14px;font:700 15px var(--f);text-align:left}
 #nav button:hover{background:var(--card)}
 #nav button.on{background:var(--card);box-shadow:var(--sh)}
 #nav button.on svg{background:none;color:var(--gt);width:24px;height:24px;padding:0;transform:none}
 main{padding-top:26px}
}
/* piezas */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 16px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--sh);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13.5px;white-space:nowrap}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card>h2{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#0f2316;border:0;border-radius:16px;padding:12px 20px;min-height:46px;font:700 15px var(--f);box-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px) scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ln)}
.btn.danger{color:var(--rt)}.btn.sm{min-height:36px;padding:7px 14px;font-size:13.5px;border-radius:12px}
.btn.big{flex:1;min-height:54px;font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;background:var(--card);border:0;box-shadow:inset 0 0 0 1.5px var(--ln);padding:8px 15px;border-radius:99px;font:600 14px var(--f);transition:.15s}
.chip:active{transform:scale(.95)}.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.srch{position:relative;margin-bottom:10px}
.srch svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round}
.srch input{padding-left:44px;border-radius:99px;background:var(--card);box-shadow:var(--sh);border-color:transparent}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;min-height:46px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px color-mix(in srgb,var(--g) 25%,transparent)}
textarea{min-height:120px;font:12px ui-monospace,monospace;margin:8px 0}
.fld{margin-bottom:12px}.fld label,.lb{display:block;font:600 13px var(--f);color:var(--mu);margin:0 0 6px 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1.2fr 1fr 1.4fr;gap:8px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--sh)}
.kpi span{font-size:12.5px;color:var(--mu);font-weight:600}.kpi b{display:block;font:800 23px var(--fh);margin-top:2px}
.kpi small{display:block}.kpi.hero{background:var(--ink);color:var(--bg)}.kpi.hero span,.kpi.hero small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.neg{color:var(--rt)}
/* avatares */
.em{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font:700 22px var(--fh);background:hsl(var(--h,140) 70% var(--eml));color:var(--emt)}
.em.sm{width:36px;height:36px;border-radius:12px;font-size:18px}.em.big{width:62px;height:62px;border-radius:20px;font-size:32px}
/* tarjetas de producto e insumo */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.pc{background:var(--card);border:0;border-radius:24px;padding:16px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;transition:transform .18s,box-shadow .18s;animation:pop .4s both;animation-delay:calc(var(--d,0)*35ms)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}
.pc:hover{transform:translateY(-4px)}.pc:active{transform:scale(.96)}
.pc .em{margin-bottom:6px}.pc b.n{font:700 16px/1.2 var(--fh)}.pc .pr{font:800 19px var(--fh)}
.pc.no{opacity:.55}
.av{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--g2);color:var(--gt);align-self:flex-start;margin-top:4px}
.av.low{background:var(--o2);color:var(--ot)}.av.no{background:var(--r2);color:var(--rt)}
.cost{font-size:12.5px;color:var(--mu)}
.mg{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--g2);color:var(--gt)}
.mg.m{background:var(--o2);color:var(--ot)}.mg.l{background:var(--r2);color:var(--rt)}
.list{display:grid;gap:10px}
.ic{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:22px;padding:14px;text-align:left;width:100%;box-shadow:var(--sh);transition:transform .15s;animation:pop .4s both;animation-delay:calc(var(--d,0)*30ms)}
.ic:active{transform:scale(.98)}.ic:hover{transform:translateY(-2px)}
.ic .mn{flex:1;min-width:0}.ic .mn b{display:block;font:700 16px var(--fh)}
.ic .rt{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}.ic .rt b{font:800 17px var(--fh)}
.pbar{position:relative;height:8px;border-radius:99px;background:var(--ln);margin-top:8px;overflow:visible}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--g);width:var(--w);animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.pbar.o i{background:var(--o)}.pbar.r i{background:var(--r)}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mu);opacity:.5;border-radius:2px}
@keyframes grow{from{width:0}}
.tg{display:inline-flex;align-items:center;gap:4px;font:700 11.5px var(--f);font-style:normal;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tg.ok{background:var(--g2);color:var(--gt)}.tg.bajo,.tg.porvenc{background:var(--o2);color:var(--ot)}.tg.sin,.tg.venc{background:var(--r2);color:var(--rt)}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* inicio */
.hello p{margin:2px 0 0;color:var(--mu)}.hello p::first-letter,.mnav b::first-letter{text-transform:uppercase}
.ring{width:84px;height:84px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .rb{stroke:var(--ln)}.ring .rf{stroke:var(--g);stroke-dashoffset:var(--o);animation:ringin 1s cubic-bezier(.2,.8,.2,1) both}
.ring.o .rf{stroke:var(--o)}.ring.r .rf{stroke:var(--r)}
.ring text{transform:rotate(90deg);transform-origin:40px 40px;font:800 19px var(--fh);fill:var(--ink)}
@keyframes ringin{from{stroke-dashoffset:214}}
.health{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.alr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;background:none;border:0;border-top:1px solid var(--ln);padding:10px 0;text-align:left}
.alr span:nth-child(2){flex:1;font-size:14px}
.link{background:none;border:0;color:var(--gt);font-weight:700;padding:10px 0 0}
.okmsg{margin:0;font-weight:600;color:var(--gt)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bar{flex:1;min-width:0;height:100%;background:none;border:0;padding:0;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;min-height:3px;background:var(--g);opacity:.5;border-radius:4px 4px 0 0;transition:.2s;animation:up2 .6s both}
@keyframes up2{from{transform:scaleY(0);transform-origin:bottom}}
.bar.pk i{opacity:.85}.bar:hover i,.bar.sel i{opacity:1;background:var(--gt)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);border-top:1.5px solid var(--ln);padding-top:4px;margin-top:2px}
#bd{margin:10px 0 0;font-weight:600;min-height:22px}
.rk{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:center;margin-bottom:12px}
.rk .hb{grid-column:2/4;height:8px;border-radius:99px;background:var(--ln)}.rk .hb i{display:block;height:100%;border-radius:99px;background:var(--g);width:var(--w);animation:grow .8s both}
.rk>b:first-child{font:800 16px var(--fh);color:var(--mu)}
.steps{display:grid;gap:8px}.stp{display:flex;align-items:center;gap:12px;background:var(--bg);border:0;border-radius:18px;padding:12px 14px;text-align:left;width:100%}
.stp .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:800;flex:none}
.stp.done .n{background:var(--g);color:#0f2316}.stp.done b{text-decoration:line-through;opacity:.6}
.mnav{display:flex;align-items:center;gap:6px}.mnav b{min-width:140px;text-align:center;font:700 16px var(--fh)}
.rbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:20px;font-weight:700}.rbtn:active{transform:scale(.92)}
/* filas */
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--sh)}
.row>div{flex:1;min-width:0}.row b{display:block}.row .amt{flex:none;font:800 16px var(--fh)}
.row.ab{flex-wrap:wrap}.row.ab .abx{flex:1 0 100%;display:flex;gap:8px;align-items:center}.row.ab .abx .btn{flex:1}
@media (min-width:640px){.row.ab{flex-wrap:nowrap}.row.ab .abx{flex:none}.row.ab .abx .btn{flex:none}}
.empty{text-align:center;padding:36px 16px;background:var(--card);border-radius:24px;box-shadow:var(--sh)}
.empty .big{font-size:46px;display:block;margin-bottom:6px}.empty p{color:var(--mu);margin:6px 0 16px}
/* ventanas */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:30px 30px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:sheet .3s cubic-bezier(.2,.9,.25,1)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 14px}
@keyframes sheet{from{transform:translateY(60px);opacity:0}}
.nk,.nk .sheet{animation:none}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:30px}}
.sh-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}.sh-h small{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--bg);border-radius:16px;padding:10px 12px}.stats span{font-size:12px;color:var(--mu);font-weight:600;display:block}.stats b{font:800 17px var(--fh)}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{background:var(--bg);padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600}
.lt{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:10px 12px;margin-bottom:6px}.lt>div{flex:1;min-width:0}.lt>div b,.lt>div small{display:block}
.box{background:var(--bg);border-radius:20px;padding:4px 14px 14px;margin-bottom:12px}
.val{background:var(--g2);color:var(--ink);border-radius:16px;padding:12px 14px;margin:12px 0}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.acts .btn{flex:1;white-space:nowrap}
.rw{display:grid;grid-template-columns:1fr 84px 76px 34px;gap:6px;align-items:center}.rw+.rc{margin:2px 0 8px 2px;font-size:12.5px;color:var(--mu)}
.rw .x,.x{background:none;border:0;color:var(--mu);font-size:18px;width:34px;height:34px;border-radius:50%}
.ems{display:flex;flex-wrap:wrap;gap:6px}.eb{width:44px;height:44px;border-radius:14px;border:0;background:var(--bg);font-size:22px;transition:.15s}.eb.on{background:var(--g);transform:scale(1.1)}
.qty{display:flex;gap:10px;align-items:center;margin-bottom:16px}.qty input{text-align:center;font:800 28px var(--fh);min-height:60px}
.qty .rb{flex:none;width:60px;height:60px;border-radius:20px;border:0;background:var(--bg);font-size:28px;font-weight:700}.qty .rb:active{transform:scale(.92)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.pm{background:var(--bg);border:2px solid transparent;border-radius:18px;padding:12px 4px;font:700 13px var(--f);display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.pm span{font-size:24px}.pm.on{border-color:var(--g);background:var(--g2)}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--ln)}.tot b{font:800 36px var(--fh)}
.warn{background:var(--o2);color:var(--ink);border-radius:16px;padding:10px 14px;margin-top:10px;font-size:14px}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--card);padding:18px;border-radius:20px;font:700 16px var(--f);box-shadow:var(--sh);margin-bottom:10px}.mi i{font-style:normal;color:var(--mu);font-size:22px}
.mb{background:var(--card);border-radius:20px;padding:16px;margin:-4px 0 12px;box-shadow:var(--sh)}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:40px}
/* login */
.lg{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.lgc{background:var(--card);border-radius:32px;padding:32px 26px;width:100%;max-width:390px;box-shadow:var(--sh);text-align:center}
.lgc img{width:84px;height:84px;object-fit:contain;margin-bottom:8px;border-radius:24px}.lgc .fld{text-align:left}
.low{color:var(--rt);font-weight:600;min-height:22px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:30px}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
#fx span{position:absolute;font-size:26px;animation:fly .95s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand"><img id="logo" src="logo.png" alt="" onerror="this.remove()"><div><b id="hd">GastroApp</b><small id="sy"></small></div></div><nav id="nav" aria-label="Secciones"></nav></aside>
<main id="app"></main>
</div>
<div id="modal"></div><div id="login"></div><div id="fx" aria-hidden="true"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
if(!window.GASTRO||!GASTRO.url||/PEGAR/.test(GASTRO.url+GASTRO.key)){document.body.innerHTML='<p style="padding:30px;font:16px sans-serif">Falta completar <b>config.js</b> con la URL y la clave de Supabase.</p>';throw new Error('config')}
/* ============ utilidades ============ */
const $=id=>document.getElementById(id),v=id=>$(id).value,norm=s=>String(s==null?'':s).toLowerCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const rd=n=>Math.round(n*1000)/1000,r2=n=>Math.round(n*100)/100,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const M=n=>'$'+(+n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
const Q=n=>(+n||0).toLocaleString('es-AR',{maximumFractionDigits:3});
const fq=(n,u)=>{n=+n||0;if(n&&Math.abs(n)<1&&u==='kg')return Q(rd(n*1000))+' g';if(n&&Math.abs(n)<1&&u==='lt')return Q(rd(n*1000))+' ml';return Q(rd(n))+' '+u};
const hue=s=>[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(i.stock<=0)f.push('sin');else if((i.minimo||0)>0&&i.stock<=i.minimo)f.push('bajo');return f};
const take=(i,q)=>{const used=[];let rest=q;lotes(i).forEach(l=>{if(rest<=0)return;const t=Math.min(l.cant,rest);l.cant=rd(l.cant-t);rest=rd(rest-t);used.push({id:l.id,q:t})});i.stock=rd(i.stock-q);return used};
const give=(i,q,l)=>{i.stock=rd(i.stock+q);(l||[]).forEach(k=>{const o=(i.lotes||[]).find(x=>x.id===k.id);if(o)o.cant=rd(o.cant+k.q)})};
const fixL=i=>{if(!i.lotes)return;i.lotes=i.lotes.filter(l=>l.cant>1e-9);const lim=Math.max(i.stock,0);let ex=rd(sum(i.lotes,l=>l.cant)-lim);
  if(ex>0)[...i.lotes].sort((a,b)=>a.venc<b.venc?1:-1).forEach(l=>{if(ex<=0)return;const t=Math.min(l.cant,ex);l.cant=rd(l.cant-t);ex=rd(ex-t)});i.lotes=i.lotes.filter(l=>l.cant>1e-9)};

const fixDb=()=>{const e=EMPTY();Object.keys(e).forEach(k=>{if(db[k]==null||typeof db[k]!==typeof e[k]||Array.isArray(db[k])!==Array.isArray(e[k]))db[k]=e[k]});db.cfg=db.cfg||e.cfg};
const migrar=()=>{let ch=false;fixDb();const us=new Set();
  db.productos.forEach(p=>isPl(p)&&p.receta.forEach(r=>us.add(r.id)));
  db.productos.filter(p=>!isPl(p)&&us.has(p.id)).forEach(p=>{db.insumos.push({id:p.id,nombre:p.nombre,unidad:p.unidad||'un',costo:p.costo,stock:p.stock,minimo:p.minimo});db.productos=db.productos.filter(x=>x!==p);ch=true});
  db.insumos.forEach(i=>{const u=UN[i.unidad];if(!u||u.b===i.unidad)return;const k=u.f,id=i.id;
    db.productos.forEach(p=>isPl(p)&&p.receta.forEach(r=>{if(r.id===id&&!r.u)r.u=i.unidad}));

    i.stock=rd(i.stock*k);i.costo=i.costo/k;i.unidad=u.b;ch=true});
  return ch};

const A={
setCat(id){cat=id;return 2},setIfl(id){ifl=id;return 2},acc(id){ajx=ajx===id?'':id;return 2},
goto(id){const t=id.split(':');tab=t[0];ifl=t[1]||'todos';q='';return 3},
mprev(){mes=shiftM(mes,-1);return 2},mnext(){mes=shiftM(mes,1);return 2},
bar(id){const e=$('bd');if(e)e.textContent='Día '+(+id+1)+': '+M(chartData[+id]);document.querySelectorAll('.bar').forEach((b,k)=>b.classList.toggle('sel',k===+id));return 1},
closeM(){closeM();return 1},
/* ventas */
sell(id){sel={id,n:1,mp:'Efectivo'};sellSheet(false);return 1},
qm(){rq();sel.n=Math.max(1,sel.n-1);sellSheet(true);return 1},qp(){rq();sel.n++;sellSheet(true);return 1},
setMp(id){rq();sel.mp=id;sellSheet(true);return 1},
cobrar(){rq();const p=prod(sel.id);if(!p)return 1;const m=need(p,sel.n);
  if(m.length&&!confirm('Faltan insumos: '+m.map(x=>x.i.nombre).join(', ')+'.\n¿Vender igual?'))return 1;
  const n=sel.n,from=Math.min(Math.max(p.stock,0),n),falta=n-from,cons=[];p.stock=rd(p.stock-from);
  if(falta>0&&isPl(p))p.receta.forEach(r=>{const i=ins(r.id);if(i){const x=rd(qb(r,i)*falta);cons.push({id:i.id,q:x,l:take(i,x)})}});
  db.ventas.push({id:uid(),t:uid(),fecha:today(),pid:p.id,nombre:p.nombre,cant:n,precio:p.precio,costo:cst(p),mp:sel.mp,cons,sk:from});
  const ng=negs();closeM();burst();toast(ng.length?'Vendido. Falta stock de: '+ng.join(', '):'¡Venta registrada! '+M(p.precio*n))},
delVenta(id){const c=db.ventas.find(x=>x.id===id);if(!confirm('¿Anular esta venta y devolver el stock?'))return 1;
  const p=prod(c.pid);if(p&&c.sk)p.stock=rd(p.stock+c.sk);(c.cons||[]).forEach(k=>{const i=ins(k.id)||prod(k.id);if(i)give(i,k.q,k.l)});db.ventas=db.ventas.filter(x=>x.id!==id);toast('Venta anulada')},
/* productos */
openProd(id){prodSheet(id);return 1},
newProd(){if(!db.insumos.length){toast('Primero cargá insumos en la pestaña Insumos');return 1}editId=null;const f=db.insumos[0];tmp={kind:'p',nombre:'',cat:'',emoji:'🍱',precio:0,stock:0,receta:[{id:f.id,cant:0,u:f.unidad}]};modalP(false);return 1},
editProd(id){const p=prod(id);editId=id;tmp={kind:'p',nombre:p.nombre,cat:p.cat||'',emoji:p.emoji||'',precio:p.precio,stock:p.stock,receta:(p.receta||[]).map(r=>({...r,u:r.u||(ins(r.id)||{}).unidad}))};if(!tmp.receta.length&&db.insumos[0])tmp.receta=[{id:db.insumos[0].id,cant:0,u:db.insumos[0].unidad}];modalP(false);return 1},
pickEm(id){readM();tmp.emoji=id;document.querySelectorAll('.eb').forEach(b=>b.classList.toggle('on',b.dataset.id===id));return 1},
mk(id){readM();const c=cst({receta:tmp.receta});if(!(c>0)){toast('Primero poné las cantidades de la receta');return 1}tmp.precio=Math.ceil(c/(1-id/100)/10)*10;$('mpr').value=tmp.precio;$('val').innerHTML=valHtml();return 1},
addIng(){readM();const f=db.insumos[0];if(!f){toast('Primero cargá insumos');return 1}tmp.receta.push({id:f.id,cant:0,u:f.unidad});modalP(true);return 1},
delIng(id){readM();tmp.receta.splice(+id,1);modalP(true);return 1},
saveProd(){readM();const n=tmp.nombre.trim();if(!n){toast('Falta el nombre');return 1}
  const rec=tmp.receta.filter(r=>ins(r.id)&&r.cant>0);if(!rec.length){toast('Agregá al menos un insumo con su cantidad');return 1}
  const d={nombre:n,cat:tmp.cat.trim(),emoji:tmp.emoji||'',precio:tmp.precio,stock:tmp.stock,receta:rec};
  if(editId)Object.assign(prod(editId),d);else db.productos.push({id:uid(),costo:0,...d});closeM();toast('Producto guardado ✔')},
delProd(id){if(!confirm('¿Borrar este producto?'))return 1;db.productos=db.productos.filter(p=>p.id!==id);closeM()},
elabOpen(id){eqs={id,n:1};elabSheet(false);return 1},
eqm(){if($('eq'))eqs.n=Math.max(1,Math.floor(+v('eq'))||1);eqs.n=Math.max(1,eqs.n-1);elabSheet(true);return 1},
eqp(){if($('eq'))eqs.n=Math.max(1,Math.floor(+v('eq'))||1);eqs.n++;elabSheet(true);return 1},
elabGo(){if($('eq'))eqs.n=Math.max(1,Math.floor(+v('eq'))||1);const p=prod(eqs.id),n=eqs.n;
  p.receta.forEach(r=>{const i=ins(r.id);if(i)take(i,qb(r,i)*n)});p.stock=rd(p.stock+n);const ng=negs();closeM();burst();toast(ng.length?'Listo. Falta stock de: '+ng.join(', '):'¡Listo! +'+n+' '+p.nombre)},
/* insumos */
openIns(id){insSheet(id);return 1},
newIns(){editId=null;tmp={kind:'i',mode:'new',nombre:'',cat:'Otros',base:'kg',cu:'kg',cc:0,ct:0,minimo:0,venc:''};modalI(false);return 1},
buyIns(id){const i=ins(id);editId=id;tmp={kind:'i',mode:'buy',nombre:i.nombre,base:i.unidad,cu:i.cu&&UN[i.cu]&&UN[i.cu].b===i.unidad?i.cu:i.unidad,cc:0,ct:0,venc:''};modalI(false);return 1},
editIns(id){const i=ins(id);editId=id;tmp={kind:'i',mode:'edit',nombre:i.nombre,cat:i.cat||'Otros',base:i.unidad,minimo:i.minimo||0,stock:i.stock,costo:i.costo};modalI(false);return 1},
icat(id){readI();tmp.cat=id;document.querySelectorAll('[data-act=icat]').forEach(b=>b.classList.toggle('on',b.dataset.id===id));return 1},
saveIns(){readI();const m=tmp.mode;if(m!=='buy'&&!tmp.nombre.trim()){toast('Falta el nombre');return 1}let i=editId?ins(editId):null;
  if(m!=='edit'){const cb=rd(tmp.cc*UN[tmp.cu].f);if(!(cb>0&&tmp.ct>0)){toast('Completá cantidad y costo total');return 1}
    const costo=tmp.ct/cb;if(m==='new'){i={id:uid(),nombre:tmp.nombre.trim(),cat:tmp.cat,unidad:tmp.base,costo,stock:0,minimo:tmp.minimo,lotes:[]};db.insumos.push(i)}
    i.stock=rd(i.stock+cb);i.costo=costo;i.cc=tmp.cc;i.cu=tmp.cu;i.ct=tmp.ct;const c={id:uid(),fecha:today(),pid:i.id,nombre:i.nombre,cant:cb,costo};
    if(tmp.venc){const l={id:uid(),cant:cb,venc:tmp.venc};i.lotes=(i.lotes||[]).concat([l]);c.lid=l.id;c.venc=tmp.venc}db.compras.push(c)}
  else{Object.assign(i,{nombre:tmp.nombre.trim(),cat:tmp.cat,minimo:tmp.minimo,stock:tmp.stock});if(tmp.costo>0)i.costo=tmp.costo}
  closeM();toast('Insumo guardado ✔')},
delIns(id){const u=db.productos.filter(p=>isPl(p)&&p.receta.some(r=>r.id===id));if(u.length){toast('Está en la receta de: '+u.map(p=>p.nombre).join(', '));return 1}
  if(!confirm('¿Borrar este insumo?'))return 1;db.insumos=db.insumos.filter(i=>i.id!==id);closeM()},
disc(id){const k=id.split('|'),i=ins(k[0]),l=(i.lotes||[]).find(x=>x.id===k[1]);if(!l||!confirm('¿Descartar '+fq(l.cant,i.unidad)+' vencidos de '+i.nombre+'?'))return 1;
  db.mermas.push({id:uid(),fecha:today(),iid:i.id,nombre:i.nombre,cant:l.cant,costo:i.costo});i.stock=rd(i.stock-l.cant);l.cant=0;closeM();toast('Descartado. Quedó registrado como pérdida.')},
delCompra(id){const c=db.compras.find(x=>x.id===id),i=ins(c.pid);if(!confirm('¿Anular esta compra y restar el stock?'))return 1;
  if(i){const l=(i.lotes||[]).find(x=>x.id===c.lid);if(l)l.cant=rd(Math.max(0,l.cant-c.cant));i.stock=rd(i.stock-c.cant)}db.compras=db.compras.filter(x=>x.id!==id);toast('Compra anulada')},
/* abonos */
newAb(){abTipo='gasto';abSheet();return 1},
abT(id){abTipo=id;$('t1').classList.toggle('on',id==='gasto');$('t2').classList.toggle('on',id==='cobro');return 1},
saveAb(){const n=v('an').trim();if(!n){toast('Falta el concepto');return 1}db.abonos.push({id:uid(),nombre:n,tipo:abTipo,monto:+v('am')||0,dia:Math.min(31,Math.max(1,+v('ad')||1))});closeM();toast('Abono guardado ✔')},
togPago(id){const k=id+'|'+mes;if(db.pagos[k])delete db.pagos[k];else{db.pagos[k]=today();burst()}},
delAbono(id){if(!confirm('¿Borrar este abono?'))return 1;db.abonos=db.abonos.filter(a=>a.id!==id)},
/* ajustes */
copy(){const t=$('exp');t.select();try{document.execCommand('copy');toast('Copiado ✔')}catch(e){}return 1},
dl(){const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gastroapp-respaldo-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();return 1},
import(){try{const d=JSON.parse(v('imp'));if(!d||!d.productos)throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return 1;db=Object.assign(EMPTY(),d);migrar();ajx='';toast('Respaldo restaurado ✔')}catch(e){toast('Respaldo inválido');return 1}},
logout(){sb.auth.signOut().then(()=>location.reload());return 1}};

/* ============ pantallas base ============ */
function render(an){$('hd').textContent=(db.cfg&&db.cfg.local)||'GastroApp';
  $('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-tab="${t[0]}" aria-label="${t[1]}" ${t[0]===tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[t[0]]}</svg><span>${t[1]}</span></button>`).join('');
  const app=$('app');app.innerHTML=V[tab]();
  if(an){app.classList.remove('in');void app.offsetWidth;app.classList.add('in');window.scrollTo(0,0);if(!reduced())document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,m=el.dataset.m==='1',t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.textContent=m?M(n*e):Q(n*e);if(k<1)requestAnimationFrame(f);else el.textContent=m?M(n):Q(n)};requestAnimationFrame(f)})}}
const showLogin=msg=>{$('login').innerHTML=`<div class="lg"><div class="lgc"><img src="logo.png" alt="" onerror="this.remove()"><h1>GastroApp</h1><p class="mu" style="margin:4px 0 22px">Ingresá con tu usuario</p><div class="fld"><label for="lu">Usuario</label><input id="lu" autocapitalize="none" autocomplete="username"></div><div class="fld"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn" id="lb" style="width:100%;margin-top:6px">Entrar</button><p class="low" style="margin:12px 0 0">${msg||''}</p></div></div>`;
  const lb=$('lb');lb.onclick=async()=>{let u=v('lu').trim().toLowerCase();if(!u.includes('@'))u+='@gastro.app';lb.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:u,password:v('lp')});
    if(error){const m=error.message||'';showLogin(m.includes('Invalid login')?'Usuario o contraseña incorrectos':m.includes('not confirmed')?'El usuario no está confirmado en Supabase':'Error de conexión: '+m+' → revisá config.js')}else start()};
  $('lp').onkeydown=e=>{if(e.key==='Enter')lb.click()}};
const start=async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}
  uidU=session.user.id;userLabel=(session.user.email||'').replace('@gastro.app','');$('login').innerHTML='';setSync('Cargando…');
  const {data,error}=await sb.from('datos').select('k,v,updated_at');
  if(error){try{db=Object.assign(EMPTY(),JSON.parse(localStorage.getItem('gastro_c_'+uidU)))}catch(e){}migrar();setSync('! Sin conexión (datos locales)');render(true);return}
  loadRows(data);if(migrar())save();setSync('● Sincronizado');render(true)};

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('ov')){closeM();return}
  const b=e.target.closest('button');if(!b)return;buzz();
  if(b.dataset.tab){tab=b.dataset.tab;q='';cat='Todas';ifl='todos';render(true);return}
  const f=A[b.dataset.act];if(!f)return;const r=f(b.dataset.id);
  if(r===1)return;if(r===3){render(true);return}if(r!==2)save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.q!==undefined){q=e.target.value;const f=listFn();if(f&&$('lst'))$('lst').innerHTML=f()}
  else if(d.live!==undefined)live();
  else if(d.sq!==undefined){sel.n=Math.max(1,Math.floor(+e.target.value)||1);$('st').textContent=M(prod(sel.id).precio*sel.n);$('sw').innerHTML=sellWarn()}
  else if(d.eq!==undefined){eqs.n=Math.max(1,Math.floor(+e.target.value)||1);$('ew').innerHTML=elabWarn()}});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.ri!==undefined){readM();tmp.receta[+d.ri].u=ins(tmp.receta[+d.ri].id).unidad;modalP(true)}
  else if(d.base!==undefined){readI();tmp.cu=compat(tmp.base)[0];modalI(true)}
  else if(d.live!==undefined)live();
  else if(d.file!==undefined){const fl=e.target.files[0];if(fl){const r=new FileReader();r.onload=()=>{$('imp').value=r.result};r.readAsText(fl)}}});
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!uidU||pend||$('modal').innerHTML)return;
  const {data:h}=await sb.from('datos').select('updated_at');if(!h||!h.some(r=>+new Date(r.updated_at)>lastTs))return;
  const {data}=await sb.from('datos').select('k,v,updated_at');if(!data||pend)return;
  loadRows(data);if(migrar())save();render();setSync('● Sincronizado')});
start();
</script>
